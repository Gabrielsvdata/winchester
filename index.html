<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Winchester: fan game em pixel art no estilo beat 'em up, inspirado em Supernatural. Feito por Gabriel Silvano.">
<title>Winchester: O Negócio da Família</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap">
<style>
/* Layout: tela de console 320x224 ampliada sem suavizar; no celular em pé, controles ficam embaixo como num portátil */
:root{
  --void:#07060d;
  --panel:#0f0d1a;
  --rim:#3a3150;
  --bone:#efe8d6;
  --mist:#9fb6c8;
  --amber:#f2b632;
  --blood:#c8392c;
  --ghost:#9fe8ff;
  --f-pixel:'Press Start 2P','Courier New',monospace;
  --f-text:'VT323','Courier New',monospace;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;background:var(--void);color:var(--bone);overflow:hidden}
body{font-family:var(--f-text);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
#app{position:fixed;inset:0;background:var(--void);overflow:hidden}
#cv{position:absolute;image-rendering:pixelated;image-rendering:crisp-edges;background:#000;touch-action:none}
button{font-family:var(--f-pixel);cursor:pointer;color:var(--bone)}
button:focus-visible{outline:2px solid var(--amber);outline-offset:2px}

#topbtns{position:absolute;right:calc(env(safe-area-inset-right,0px) + 8px);top:calc(env(safe-area-inset-top,0px) + 8px);display:flex;gap:6px;z-index:5}
#topbtns button{background:rgba(15,13,26,.85);border:2px solid var(--rim);font-size:9px;padding:7px 8px;line-height:1}

/* Telas */
#screen{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;overflow-y:auto;z-index:4;background:rgba(7,6,13,.72)}
.box{width:100%;max-width:620px;margin:auto;background:var(--panel);border:3px solid var(--rim);box-shadow:0 0 0 3px var(--void),0 0 0 6px var(--amber);padding:22px 20px;display:flex;flex-direction:column;gap:14px}
.box.clear{background:transparent;border:0;box-shadow:none;padding:0}
.eyebrow{font-family:var(--f-pixel);font-size:10px;color:var(--amber);letter-spacing:.08em;margin:0;line-height:1.6}
h1{font-family:var(--f-pixel);font-weight:400;font-size:clamp(22px,6.4vw,40px);line-height:1.25;margin:0;color:var(--bone);text-shadow:4px 4px 0 var(--blood)}
h1 span{color:var(--amber);text-shadow:4px 4px 0 #6a3a00}
h2{font-family:var(--f-pixel);font-weight:400;font-size:clamp(14px,3.6vw,20px);line-height:1.4;margin:0;color:var(--bone)}
.txt{font-size:24px;line-height:1.15;margin:0;color:var(--bone);min-height:3em}
.sub{font-size:20px;line-height:1.15;color:var(--mist);margin:0}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{background:var(--panel);border:3px solid var(--rim);padding:12px 14px;font-size:11px;line-height:1.3}
.btn:hover{border-color:var(--mist)}
.btn.go{background:var(--amber);color:#1a1206;border-color:#ffd77a}
.blink{animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.keys{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:20px;line-height:1.1;border-top:2px dashed var(--rim);padding-top:12px}
.keys dt{font-family:var(--f-pixel);font-size:9px;color:var(--amber);padding-top:5px}
.keys dd{margin:0;color:var(--mist)}
.fine{font-size:17px;color:#6c6884;margin:0;line-height:1.1}

.pick{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.card{background:#0a0914;border:3px solid var(--rim);padding:12px;display:flex;flex-direction:column;gap:8px;text-align:left;color:var(--bone);font-family:var(--f-text)}
.card:hover,.card:focus-visible{border-color:var(--amber);outline:none}
.card canvas{width:144px;height:144px;image-rendering:pixelated;align-self:center;background:radial-gradient(circle at 50% 70%,#221c3a,#0a0914 70%)}
.card .nm{font-family:var(--f-pixel);font-size:14px;color:var(--amber)}
.card .ln{font-size:19px;line-height:1.05;color:var(--mist)}
.card .ln b{color:var(--bone);font-weight:400}
.stat{display:grid;grid-template-columns:7.5em 1fr;align-items:center;font-size:18px;color:var(--mist)}
.stat i{display:flex;gap:3px}
.stat i::before{content:'';display:block;height:9px;width:calc(var(--v) * 15px);background:repeating-linear-gradient(90deg,var(--blood) 0 12px,transparent 12px 15px)}
.newhero{display:flex;gap:12px;align-items:center;border:3px solid var(--amber);background:#141022;padding:10px}
.newhero canvas{width:96px;height:96px;flex:none;image-rendering:pixelated;background:radial-gradient(circle at 50% 70%,#2a2244,#0a0914 70%)}
.newhero .nh{display:flex;flex-direction:column;gap:4px;min-width:0}
.newhero .tag,.card .tag{font-family:var(--f-pixel);font-size:9px;color:#1a1206;background:var(--amber);padding:3px 6px;align-self:flex-start}
.newhero p{margin:0;font-size:20px;line-height:1.1;color:var(--bone)}
.newhero .nm{font-family:var(--f-pixel);font-size:13px;color:var(--amber)}
.card.isnew{border-color:var(--amber)}
@media (max-width:520px){.pick{grid-template-columns:1fr}.card{flex-direction:row;flex-wrap:wrap;align-items:center}.card canvas{width:96px;height:96px}.card .info{flex:1;min-width:0}}

/* Legenda da abertura */
#cap{position:absolute;z-index:4;box-sizing:border-box;padding:12px 14px;background:var(--void);display:flex;flex-direction:column;gap:6px}
#cap.below{background:var(--void)}
#capPlace{overflow-wrap:anywhere;font-family:var(--f-pixel);font-size:clamp(7px,2vw,9px);color:var(--amber);margin:0;letter-spacing:.06em;line-height:1.6}
#capText{font-size:clamp(20px,2.5vw,26px);line-height:1.1;margin:0;color:var(--bone);min-height:3.3em}
.caprow{display:flex;justify-content:space-between;align-items:center;gap:10px}
#capHint{font-family:var(--f-pixel);font-size:8px;color:var(--mist)}
#capSkip{background:transparent;border:2px solid var(--rim);font-size:8px;padding:7px 9px}
/* Controles de toque */
#pad{position:absolute;left:0;right:0;bottom:0;z-index:3;pointer-events:none}
#stick{position:absolute;left:calc(env(safe-area-inset-left,0px) + 22px);bottom:calc(env(safe-area-inset-bottom,0px) + 26px);width:132px;height:132px;border-radius:50%;background:rgba(15,13,26,.7);border:3px solid var(--rim);pointer-events:auto;touch-action:none}
#knob{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;background:#2a2340;border:3px solid var(--mist)}
#btns{position:absolute;right:calc(env(safe-area-inset-right,0px) + 16px);bottom:calc(env(safe-area-inset-bottom,0px) + 16px);width:176px;height:156px;pointer-events:auto}
#btns button{position:absolute;width:64px;height:64px;border-radius:50%;border:3px solid var(--rim);background:rgba(15,13,26,.8);font-size:8px;line-height:1.3;touch-action:none;padding:0}
#bAtk{right:0;top:46px;border-color:var(--blood)!important;width:72px!important;height:72px!important;background:rgba(80,20,16,.8)!important}
#bJmp{left:56px;top:0;border-color:var(--amber)!important}
#bSht{left:0;top:52px}
#bMag{left:56px;bottom:0;border-color:var(--ghost)!important}
#btns button.on{filter:brightness(1.6)}
</style>
</head>
<body>
<div id="app">
  <canvas id="cv" width="320" height="224"></canvas>
  <div id="topbtns"><button id="sndBtn" type="button">SOM ON</button><button id="pauseBtn" type="button">II</button></div>
  <div id="pad" hidden>
    <div id="stick"><div id="knob"></div></div>
    <div id="btns">
      <button id="bJmp" type="button">PULO</button>
      <button id="bSht" type="button">TIRO</button>
      <button id="bAtk" type="button">ATACAR</button>
      <button id="bMag" type="button">MAGIA</button>
    </div>
  </div>
  <div id="cap" hidden><p id="capPlace"></p><p id="capText"></p><div class="caprow"><span id="capHint" class="blink"></span><button id="capSkip" type="button">PULAR ▶▶</button></div></div>
  <div id="screen"></div>
</div>

<script>
'use strict';
/* ============ Constantes ============ */
const SW=320,SH=224,LT=152,LB=214,STAGE_W=1840,GRAV=460;
const cv=document.getElementById('cv'),c=cv.getContext('2d');
c.imageSmoothingEnabled=false;
const $=s=>document.querySelector(s);
const rand=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const sgn=v=>v<0?-1:1;
function seeded(s){return()=>{s=(s*16807)%2147483647;return(s-1)/2147483646;};}
const FONT='"Press Start 2P", monospace';

/* ============ Primitivas de pixel ============ */
function px(g,x,y,w,h,col){g.fillStyle=col;g.fillRect(Math.round(x),Math.round(y),w,h);}
function limb(g,x0,y0,x1,y1,w,col){g.fillStyle=col;const dx=x1-x0,dy=y1-y0,n=Math.max(1,Math.ceil(Math.max(Math.abs(dx),Math.abs(dy))));for(let i=0;i<=n;i++){g.fillRect(Math.round(x0+dx*i/n-w/2),Math.round(y0+dy*i/n-w/2),w,w);}}
function disc(g,cx,cy,r,col){g.fillStyle=col;for(let y=-r;y<=r;y++){const hw=Math.round(Math.sqrt(r*r-y*y));g.fillRect(Math.round(cx-hw),Math.round(cy+y),hw*2+1,1);}}
function icon(g,map,pal,x,y){for(let r=0;r<map.length;r++)for(let k=0;k<map[r].length;k++){const ch=map[r][k];if(ch!=='.'){g.fillStyle=pal[ch];g.fillRect(x+k,y+r,1,1);}}}
const ACC={'Á':'A´','À':'A`','Â':'A^','Ã':'A~','É':'E´','Ê':'E^','Í':'I´','Ó':'O´','Ô':'O^','Õ':'O~','Ú':'U´','Ç':'C,'};
function accent(k,x,y,u,col){c.fillStyle=col;const r=(a,b,w,h)=>c.fillRect(Math.round(x+a*u),Math.round(y+b*u),Math.max(1,Math.round(w*u)),Math.max(1,Math.round(h*u)));
  if(k==='´'){r(4,-3,2,1);r(3,-2,2,1);}else if(k==='`'){r(2,-3,2,1);r(3,-2,2,1);}else if(k==='^'){r(3,-3,1,1);r(2,-2,1,1);r(4,-2,1,1);}else if(k==='~'){r(1,-2,1,1);r(2,-3,2,1);r(4,-2,1,1);r(5,-3,1,1);}else if(k===','){r(3,7,2,1);r(4,8,1,1);r(2,9,2,1);}}
function text(s,x,y,col,size,align,shadow){
  size=size||8;const u=size/8,chars=[...String(s)],w=chars.length*size;
  const x0=Math.round(align==='center'?x-w/2:align==='right'?x-w:x);y=Math.round(y);
  c.font=`${size}px ${FONT}`;c.textAlign='left';c.textBaseline='top';
  const pass=(dx,dy,colr)=>{for(let i=0;i<chars.length;i++){const ch=chars[i],a=ACC[ch],base=a?a[0]:ch.normalize('NFD').replace(/[̀-ͯ]/g,''),cx2=x0+i*size+dx;c.fillStyle=colr;c.fillText(base,cx2,y+dy);if(a)accent(a[1],cx2,y+dy,u,colr);}};
  if(shadow!==false)pass(1,1,'#000');pass(0,0,col);
}

const ICONS={
  salt:{map:['..kk..','.wwww.','wwbbww','wbwwbw','wwbbww','.wwww.'],pal:{k:'#8a7a5a',w:'#f2f0ea',b:'#3a6ab0'}},
  pie:{map:['...cccc...','.cRcRRcRc.','cRRcRRcRRc','cccccccccc','.dddddddd.'],pal:{c:'#e0a050',R:'#a8283a',d:'#7a4a22'}},
  burger:{map:['.bbbbbb.','bbwbbwbb','gggggggg','mmmmmmmm','yyyyyyyy','.bbbbbb.'],pal:{b:'#d0882a',w:'#f4e4b0',g:'#4a9a3a',m:'#6a2a1a',y:'#e8c02a'}},
};

/* ============ Boneco de pixel ============ */
const BUF=72,OX=36,OY=66;
function mk(){const k=document.createElement('canvas');k.width=k.height=BUF;const g=k.getContext('2d');g.imageSmoothingEnabled=false;return[k,g];}
const [buf,bg]=mk(),[sil,sg]=mk(),[sil2,sg2]=mk();

const LOOKS={
  dean:{skin:'#eab68c',hair:'#9a7040',style:'short',jacket:'#64401f',jacketD:'#432a14',shirt:'#4e5c44',pants:'#3e4e72',pantsD:'#2a3652',boots:'#1c1410',weapon:'#8c949e',gun:'shotgun',tall:0},
  sam:{skin:'#eab892',hair:'#5c3a1c',style:'long',jacket:'#8e3026',jacketD:'#5e1c16',plaid:'#5a1610',shirt:'#c8b89a',pants:'#3a4a74',pantsD:'#283454',boots:'#2a1e14',weapon:'#9aa2ac',gun:'pistol',tall:3},
  john:{skin:'#e0aa82',hair:'#3a2a1c',style:'short',beard:'#3a2a1c',jacket:'#3c3a30',jacketD:'#28261e',shirt:'#6a6458',pants:'#2e3444',pantsD:'#1e2230',boots:'#1a1410',weapon:'#b8bec6',gun:'rifle',tall:2},
  bobby:{skin:'#e2ae88',hair:'#6a5a4a',style:'cap',cap:'#7a3a1a',beard:'#8a7a6a',jacket:'#4a5a3a',jacketD:'#323e28',shirt:'#8a4a32',plaid:'#5a2a1a',pants:'#3a3a44',pantsD:'#26262e',boots:'#2a1e14',weapon:'#8c949e',gun:'flask',tall:1},
  cas:{skin:'#ecc4a0',hair:'#2a2018',style:'messy',jacket:'#b49a6a',jacketD:'#8a7448',shirt:'#e8e8e8',tie:'#2a3a6a',pants:'#2a2a30',pantsD:'#1c1c22',boots:'#141414',weapon:'#dfe6ee',tall:2},
  johnSpirit:{skin:'#bcd4e4',hair:'#4a5a6c',style:'short',beard:'#4a5a6c',jacket:'#6a84a0',jacketD:'#4c6280',shirt:'#9ab0c4',pants:'#4a5a74',pantsD:'#36445a',boots:'#2a3444',tall:2},
  luther:{skin:'#d6cccc',hair:'#2a1a14',style:'short',beard:'#2a1a14',jacket:'#2a1a16',jacketD:'#1a100c',shirt:'#5a1a1a',pants:'#1e1e24',pantsD:'#141418',boots:'#0e0a08',eye:'#ff2020',fangs:true,tall:5},
  meg:{skin:'#ecc8a8',hair:'#d8b060',style:'woman',jacket:'#2a1f2c',jacketD:'#1a141c',shirt:'#5a2a3a',pants:'#1c1820',pantsD:'#141018',boots:'#0c0a0c',eye:'#000',tall:1},
  azazel:{skin:'#d8ac88',hair:'#5a5550',style:'short',jacket:'#4a5a78',jacketD:'#34405a',shirt:'#8a8270',pants:'#2e3648',pantsD:'#1e2432',boots:'#1a1410',eye:'#ffd400',tall:4},
  woman:{skin:'#e2ecf2',hair:'#0a0a12',style:'woman',dress:'#f0f4f8',dressD:'#a8b4c2',jacket:'#e6ecf2',jacketD:'#b0bcc8',shirt:'#f8fbfc',eye:'#000',skirt:true,tall:5,boots:'#000'},
};
const GHOSTS=[
  {skin:'#b6ccd8',hair:'#334454',style:'short',jacket:'#566a80',jacketD:'#3c4c5e',shirt:'#90a4b4',pants:'#3a4656',pantsD:'#283240',boots:'#1a2230',eye:'#000'},
  {skin:'#bcd0d8',hair:'#2a3038',style:'short',jacket:'#6a5c7c',jacketD:'#483e58',plaid:'#3a304a',shirt:'#a0a8b8',pants:'#3a4250',pantsD:'#262e3a',boots:'#161c26',eye:'#000',tall:2},
  {skin:'#b0c8cc',hair:'#4a4a3a',style:'short',jacket:'#4a6a62',jacketD:'#324a44',shirt:'#8aa098',pants:'#404a4a',pantsD:'#2a3232',boots:'#182020',eye:'#000',tall:1},
];
const SCREAMER={skin:'#c6d8e4',hair:'#141420',style:'woman',jacket:'#7a8ca4',jacketD:'#56647a',shirt:'#a8b8cc',dress:'#8a9cb4',dressD:'#5a6a82',skirt:true,eye:'#000',boots:'#000',tall:1};

function drawPuppet(g,L,P){
  g.clearRect(0,0,BUF,BUF);
  const T=L.tall||0,th=10+T*.4,sh=10+T*.4,tor=17+T*.5,ua=8,fa=8;
  const hipX=OX,hipY=OY-th-sh+(P.crouch||0);
  const neckX=hipX+(P.lean||0),neckY=hipY-tor;
  const leg=(a,col)=>{const kx=hipX+Math.sin(a[0])*th,ky=hipY+Math.cos(a[0])*th,s=a[0]-a[1],fx=kx+Math.sin(s)*sh,fy=ky+Math.cos(s)*sh;limb(g,hipX,hipY,kx,ky,4,col);limb(g,kx,ky,fx,fy,4,col);px(g,fx-1,fy-1,5,3,L.boots);};
  const arm=(a,col)=>{const sx=neckX,sy=neckY+3,ex=sx+Math.sin(a[0])*ua,ey=sy+Math.cos(a[0])*ua,s=a[0]+a[1],hx=ex+Math.sin(s)*fa,hy=ey+Math.cos(s)*fa;limb(g,sx,sy,ex,ey,4,col);limb(g,ex,ey,hx,hy,3,col);px(g,hx-1,hy-1,3,3,L.skin);return{hx,hy,s};};
  if(L.skirt){
    const flow=P.flow||0;
    for(let y=Math.round(hipY-3);y<=OY;y++){const k=(y-hipY+3)/(OY-hipY+3),w=Math.round(5+k*8+Math.sin(y*.5+flow)*1.2),x=hipX+(P.lean||0)*(1-k)*.4;px(g,x-w,y,w,1,L.dressD);px(g,x,y,w+1,1,L.dress);}
  }else leg(P.bl,L.pantsD);
  arm(P.ba,L.jacketD);
  limb(g,hipX,hipY-2,neckX,neckY+3,9,L.jacket);
  if(L.plaid){for(let y=Math.round(neckY+5);y<hipY-1;y+=3){const k=(hipY-y)/(hipY-neckY),x=hipX+(neckX-hipX)*k;px(g,x-4,y,9,1,L.plaid);}for(let d=-3;d<=3;d+=3)limb(g,hipX+d,hipY-3,neckX+d,neckY+4,1,L.plaid);}
  limb(g,hipX+2,hipY-3,neckX+2,neckY+5,3,L.shirt);
  if(L.tie)limb(g,hipX+2,hipY-6,neckX+2,neckY+5,1,L.tie);
  if(!L.skirt){px(g,hipX-4,hipY-3,9,2,'#1a1410');leg(P.fl,L.pants);}
  const hx=neckX+1,hy=neckY-4;
  if(L.style==='woman'){px(g,hx-6,hy-3,5,15,L.hair);}
  disc(g,hx,hy,4,L.skin);
  g.fillStyle=L.hair;
  if(L.style==='short'){g.fillRect(hx-4,hy-5,9,3);g.fillRect(hx-4,hy-3,2,3);g.fillRect(hx+3,hy-4,2,1);}
  else if(L.style==='long'){g.fillRect(hx-4,hy-5,9,3);g.fillRect(hx-5,hy-3,3,7);g.fillRect(hx+2,hy-3,3,2);}
  else if(L.style==='woman'){g.fillRect(hx-5,hy-5,10,3);g.fillRect(hx-5,hy-3,3,9);g.fillRect(hx+3,hy-3,2,6);}
  else if(L.style==='messy'){g.fillRect(hx-4,hy-5,9,3);g.fillRect(hx-3,hy-6,2,1);g.fillRect(hx+1,hy-6,2,1);g.fillRect(hx-4,hy-3,2,2);}
  else if(L.style==='cap'){g.fillRect(hx-4,hy-3,2,3);g.fillStyle=L.cap;g.fillRect(hx-5,hy-6,10,3);g.fillRect(hx+2,hy-4,5,1);}
  if(P.mouth){px(g,hx+1,hy+1,3,3,'#000');if(L.fangs){px(g,hx+1,hy+1,1,1,'#fff');px(g,hx+3,hy+1,1,1,'#fff');}}
  if(L.beard){px(g,hx-1,hy+2,5,2,L.beard);px(g,hx-3,hy,2,3,L.beard);}
  px(g,hx+2,hy-1,1,2,L.eye||'#1a1010');
  if(L.eye==='#000'){px(g,hx+1,hy-1,2,2,'#000');}
  const f=arm(P.fa,L.jacket);
  if(P.colt){px(g,f.hx-2,f.hy-2,10,2,'#c8ccd4');px(g,f.hx-3,f.hy-1,3,3,'#6a4a2a');px(g,f.hx+6,f.hy-3,2,1,'#fff');}
  else if(P.gun&&L.gun){if(L.gun==='flask'){px(g,f.hx-1,f.hy-6,4,6,'#7ab8f0');px(g,f.hx,f.hy-8,2,2,'#d8d0c0');}
    else{const len=L.gun==='rifle'?20:L.gun==='shotgun'?17:10,stock=L.gun==='pistol'?'#22252c':'#5a3a22';px(g,f.hx-2,f.hy-2,len,2,'#22252c');px(g,f.hx-4,f.hy-1,4,3,stock);px(g,f.hx+len-4,f.hy-3,2,1,'#888');}}

/* ============ Poses ============ */
function poseFor(e){
  const s=e.st,k=e.stT,t=e.t;
  const P={lean:0,crouch:0,fl:[.12,.1],bl:[-.12,.1],fa:[.35,.6],ba:[-.2,.4]};
  const walk=(amp,lean)=>{const ph=Math.sin(e.ph);P.fl=[ph*amp,Math.max(0,-ph)*amp*1.5];P.bl=[-ph*amp,Math.max(0,ph)*amp*1.5];P.fa=[-ph*amp+.35,.6+amp*.4];P.ba=[ph*amp,.4];P.lean=lean;P.crouch=Math.abs(ph)>.7?0:1;};
  switch(s){
    case 'idle':case 'float':P.crouch=Math.sin(t*3)>0?1:0;break;
    case 'walk':walk(.55,0);break;
    case 'run':walk(.95,3);break;
    case 'atk':{const q=k/e.dur;P.fl=[.35,.1];P.bl=[-.35,.15];
      if(e.step===0){P.fa=q<.35?[-.7,1.1]:[1.55,0];P.lean=q<.35?-1:2;}
      else if(e.step===1){P.fa=q<.35?[2.9,.3]:[.85,.15];P.lean=q<.35?-1:2;}
      else{P.fl=q<.3?[.7,1.5]:[1.6,0];P.bl=[-.2,.1];P.lean=-2;P.fa=[.6,.6];P.ba=[-.7,.5];}
      break;}
    case 'jump':if(e.jatk){P.fl=[1.5,0];P.bl=[-.4,1.4];P.fa=[.3,.5];P.lean=-1;}else{P.fl=[.7,1.3];P.bl=[-.3,1];P.fa=[1.9,.6];P.ba=[-1.2,.6];}break;
    case 'runatk':P.lean=4;P.fa=[1.45,0];P.ba=[1.2,.2];P.fl=[.6,.4];P.bl=[-.8,.6];break;
    case 'shoot':P.fa=[1.57,0];P.ba=[1.4,.2];P.gun=true;P.colt=!!e.colt;P.lean=(k>.12&&k<.22)?-2:0;if(e.kind==='player'&&hero==='cas'&&!e.colt){P.gun=false;P.fa=[1.4,0];}break;
    case 'magic':
      if(e.kind==='player'&&(hero==='dean'||hero==='bobby')){P.crouch=k<.12?2:5;P.lean=3;P.fl=[.9,1.6];P.bl=[-.3,1.9];P.fa=[1.0+Math.sin(k*14)*.25,.35];P.ba=[.5,.7];P.weapon=false;P.bag=hero==='dean'&&k<1;P.spray=hero==='bobby'&&k<.6;}
      else if(e.kind==='player'&&hero==='john'){P.fa=[1.57,0];P.ba=[1.57,0];}
      else{P.fa=[3.05,0];P.ba=[2.8,0];P.weapon=false;P.crouch=k<.3?2:0;}
      break;
    case 'hurt':P.lean=-3;P.fa=[-.9,.7];P.ba=[-1.3,.4];P.fl=[.3,.2];P.bl=[-.3,.2];break;
    case 'windup':P.fa=[-.9,.9];P.ba=[-.5,.6];P.lean=-2;P.claw=true;P.weapon=false;break;
    case 'eatk':P.fa=[1.5,.05];P.ba=[1.2,.3];P.lean=3;P.claw=true;P.weapon=false;break;
    case 'recover':P.fa=[.9,.4];P.lean=1;P.weapon=false;break;
    case 'scream':case 'swind':P.fa=[2.3,.5];P.ba=[2.1,.5];P.lean=-2;P.mouth=k>.25;P.weapon=false;break;
    case 'cwind':P.fa=[1.3,.2];P.ba=[1.1,.3];P.lean=-3;P.claw=true;break;
    case 'charge':P.fa=[1.6,0];P.ba=[1.4,.1];P.lean=5;P.claw=true;P.mouth=true;break;
    case 'bwind':P.fa=[2.6,.8];P.lean=-2;P.claw=true;break;
    case 'air':case 'down':case 'dead':case 'dying':P.fl=[.1,0];P.bl=[-.1,0];P.fa=[2.6,.3];P.ba=[2.9,.2];P.weapon=e.kind==='player'?true:false;break;
    case 'getup':P.crouch=3;P.fa=[.8,.8];break;
    case 'lwind':P.fa=[1.3,.2];P.ba=[1.1,.3];P.lean=-3;P.claw=true;P.mouth=true;break;
    case 'lunge':P.fa=[1.6,0];P.ba=[1.4,.1];P.lean=5;P.claw=true;P.mouth=true;P.fl=[.8,.3];P.bl=[-.9,.5];break;
    case 'throw':P.fa=k<.45?[2.8,.5]:[1.4,0];P.ba=[-.4,.5];P.lean=k<.45?-2:3;break;
    case 'pinw':P.fa=[2.0,0];P.ba=[-.4,.6];P.lean=-1;break;
    case 'hold':P.fa=[1.5,.3];P.ba=[1.3,.4];P.lean=2;break;
    case 'held':P.fa=[-.5,.2];P.ba=[-.7,.2];P.lean=-2;P.crouch=1;P.mouth=true;break;
    case 'drop':P.fl=[.6,1.2];P.bl=[-.3,1];P.fa=[2.2,.4];P.ba=[-1.5,.5];break;
    case 'bstrike':P.fa=[1.5,.05];P.ba=[1.2,.3];P.lean=3;P.claw=true;break;
    case 'vanish':case 'appear':case 'bout':case 'bin':break;
  }
  if(e.kind!=='player')P.weapon=false;
  P.flow=t*6;
  return P;
}

  f.fillStyle=T.far;for(let x=0;x<farW;x++)f.fillRect(x,Math.round(T.farH(x)),1,160);

}

const PW={};
function pulseWave(d){if(PW[d])return PW[d];const n=32,re=new Float32Array(n),im=new Float32Array(n);for(let i=1;i<n;i++)re[i]=2/(i*Math.PI)*Math.sin(i*Math.PI*d);return PW[d]=AC.createPeriodicWave(re,im);}
function voice(f,d,wave,v,at,vib){
  const o=AC.createOscillator(),g=AC.createGain();
  if(typeof wave==='number')o.setPeriodicWave(pulseWave(wave));else o.type=wave;
  o.frequency.setValueAtTime(f,at);
  g.gain.setValueAtTime(v,at);g.gain.setValueAtTime(v,at+d*.75);g.gain.exponentialRampToValueAtTime(.0001,at+d);
  if(vib){const l=AC.createOscillator(),lg=AC.createGain();l.frequency.value=5.6;lg.gain.setValueAtTime(0,at);lg.gain.linearRampToValueAtTime(f*.014,at+Math.min(d*.6,.4));l.connect(lg).connect(o.frequency);l.start(at);l.stop(at+d+.02);}
  o.connect(g).connect(out());o.start(at);o.stop(at+d+.02);

function drumNoise(d,v,type,fq,at){const s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();if(!nb){nb=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const a=nb.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=Math.random()*2-1;}s.buffer=nb;f.type=type;f.frequency.value=fq;g.gain.setValueAtTime(v,at);g.gain.exponentialRampToValueAtTime(.0001,at+d);s.connect(f).connect(g).connect(out());s.start(at,Math.random()*.5);s.stop(at+d+.02);}

const T_ROOT=[40,40,36,38,40,40,36,35];
const T_CH=[[52,55,59],[52,55,59],[48,52,55],[50,54,57],[52,55,59],[52,55,59],[48,52,55],[47,51,54]];
const T_LEAD=[
  [76,-1,71,-1,76,79,78,-1],
  [76,-1,-1,-1,74,-1,71,-1],
  [72,-1,76,-1,79,-1,81,79],
  [78,-1,74,-1,78,-1,81,-1],
  [83,-1,-1,81,79,-1,78,-1],

  [72,-1,74,-1,76,-1,79,-1],

function titleStep(st,at,sp){
  if(st<32){
    // abertura: acordes de impacto, virada e escalada
    if(st===0){crash(at);kick(at);stab([40,47,52,59],sp*5,at,.04);voice(N(28),sp*6,'triangle',.16,at);}
    if(st===6){kick(at);stab([40,47,52,59],sp*2,at,.035);}
    if(st===8){kick(at);stab([43,50,55,62],sp*4,at,.035);voice(N(31),sp*4,'triangle',.16,at);}
    if(st===12){stab([45,52,57,64],sp*4,at,.04);voice(N(33),sp*4,'triangle',.16,at);}
    if(st>=12&&st<16)snare(at);
    const run=[64,67,71,76,79,83,88];
    if(st>=16&&st<23)voice(N(run[st-16]),sp*1.2,.25,.04,at);
    if(st===16){kick(at);crash(at);voice(N(28),sp*16,'triangle',.15,at);}
    if(st===23){voice(N(88),sp*7,.25,.045,at,true);voice(N(76),sp*7,.5,.018,at,true);}
    if(st===24)kick(at);
    if(st>=28)snare(at);
    return;
  }
  const s=(st-32)%128,bar=s>>4,q=s&15;
  if(s===0)crash(at);
  if(q===0||q===8||q===10)kick(at);
  if(q===4||q===12)snare(at);
  if(q%2===0)hat(at,q%4===2?.05:.03);
  if(q%2===0){const r=T_ROOT[bar];voice(N(q===6||q===14?r+12:r),sp*1.7,'triangle',.13,at);}
  const ch=T_CH[bar];voice(N(ch[q%3]+12),sp*.8,.125,.012,at);
  if(q%2===0){const L=T_LEAD[bar],i=q>>1,n=L[i];if(n>0){let len=1;while(i+len<8&&L[i+len]===-1)len++;const d=sp*2*len*.95;
    voice(N(n),d,.25,.04,at,len>1);voice(N(n-12),d,.5,.014,at+sp*.5,len>1);}}
}

function sched(){
  if(!AC||!song||muted||!musicOn)return;
  if(nextT<AC.currentTime)nextT=AC.currentTime+.02;

function heroCards(C){
  const isNew=id=>(C.newcomers||[]).some(n=>n.id===id);
  return C.heroes.map(id=>{const H=heroFor(id),st=H.stats,nw=isNew(id);
    const nm=id==='john'&&chapter===4?'JOHN (ESPÍRITO)':H.name;
    return`<button class="card${nw?' isnew':''}" data-act="pick" data-id="${id}" type="button"><canvas width="72" height="72" data-pv="${id}"></canvas><div class="info">${nw?'<span class="tag">NOVO</span>':''}<div class="nm">${nm}</div>
    <div class="stat">Força <i style="--v:${st.forca}"></i></div><div class="stat">Velocidade <i style="--v:${st.vel}"></i></div><div class="stat">Tiro <i style="--v:${st.tiro}"></i></div><div class="stat">Magia <i style="--v:${st.magia}"></i></div>

}

const KMAP={Enter:'atk',KeyJ:'atk',KeyZ:'atk',KeyK:'jump',KeyX:'jump',Space:'jump',KeyL:'shoot',KeyC:'shoot',KeyI:'magic',KeyV:'magic'};
addEventListener('keydown',e=>{
  audioOn();
  if(['play','title','intro'].includes(mode)&&(e.code.startsWith('Arrow')||e.code==='Space'))e.preventDefault();

  if(e.code==='Escape'||e.code==='KeyP'){if(mode==='play')pause();else if(mode==='pause')resume();return;}
  if(e.repeat)return;
  keys[e.code]=true;
  if(touchMode){touchMode=false;showPad();}
  const a=KMAP[e.code];if(a)edge[a]=1;
  if(mode==='continue'&&a){doContinue();return;}
  const dir=(e.code==='ArrowRight'||e.code==='KeyD')?1:(e.code==='ArrowLeft'||e.code==='KeyA')?-1:0;
  if(dir){const now=performance.now();if(lastTap.dir===dir&&now-lastTap.t<260)runKeyDir=dir;lastTap={dir,t:now};}
});
addEventListener('keyup',e=>{keys[e.code]=false;const dir=(e.code==='ArrowRight'||e.code==='KeyD')?1:(e.code==='ArrowLeft'||e.code==='KeyA')?-1:0;if(dir&&dir===runKeyDir)runKeyDir=0;});
addEventListener('blur',()=>{for(const k in keys)keys[k]=false;pause();});

let gpPrev={};
function readInput(dt){
  let x=0,y=0;
  if(keys.ArrowLeft||keys.KeyA)x--;if(keys.ArrowRight||keys.KeyD)x++;if(keys.ArrowUp||keys.KeyW)y--;if(keys.ArrowDown||keys.KeyS)y++;
  let run=runKeyDir!==0&&runKeyDir===Math.sign(x);
  if(stick.id!==null){x+=stick.x;y+=stick.y;if(Math.abs(stick.x)>.9){stick.full+=dt;if(stick.full>.28)run=true;}else stick.full=0;}
  const gps=navigator.getGamepads?navigator.getGamepads():[];
  for(const gp of gps){if(!gp)continue;
    const ax=gp.axes[0]||0,ay=gp.axes[1]||0;if(Math.abs(ax)>.25)x+=ax;if(Math.abs(ay)>.25)y+=ay;
    if(gp.buttons[14]&&gp.buttons[14].pressed)x--;if(gp.buttons[15]&&gp.buttons[15].pressed)x++;if(gp.buttons[12]&&gp.buttons[12].pressed)y--;if(gp.buttons[13]&&gp.buttons[13].pressed)y++;
    if(Math.abs(ax)>.95)run=true;
    const map={2:'atk',0:'jump',1:'shoot',3:'magic'};
    for(const b in map){const p=gp.buttons[b]&&gp.buttons[b].pressed;if(p&&!gpPrev[b]){edge[map[b]]=1;audioOn();if(mode==='continue')doContinue();}gpPrev[b]=p;}
    const st=gp.buttons[9]&&gp.buttons[9].pressed;if(st&&!gpPrev.st){mode==='play'?pause():mode==='pause'&&resume();}gpPrev.st=st;
    break;}
  x=clamp(x,-1,1);y=clamp(y,-1,1);
  const r={x,y,run,atk:!!edge.atk,jump:!!edge.jump,shoot:!!edge.shoot,magic:!!edge.magic};
  edge.atk=edge.jump=edge.shoot=edge.magic=0;
  return r;
}

function moveStick(e){const r=stickEl.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let dx=e.clientX-cx,dy=e.clientY-cy;const d=Math.hypot(dx,dy),m=r.width/2-14;if(d>m){dx=dx/d*m;dy=dy/d*m;}stick.x=Math.abs(dx/m)<.2?0:dx/m;stick.y=Math.abs(dy/m)<.3?0:dy/m;knob.style.transform=`translate(${dx}px,${dy}px)`;}

function strike(a,targets,reach,dmg,kd,opt){
  opt=opt||{};let hitAny=false;
  for(const b of targets){
    if(b===a||b.dead||b.inv>0)continue;
    if(b.st==='down'||b.st==='dead'||b.st==='dying'||b.st==='vanish'||b.st==='bout'||(b.st==='air'&&!opt.juggle))continue;
    if(opt.set&&opt.set.has(b))continue;
    const dx=(b.x-a.x)*a.face;
    if(dx<-6||dx>reach)continue;
    if(Math.abs(b.y-a.y)>(opt.depth||10))continue;
    if(Math.abs(b.z-a.z)>(opt.zr||24))continue;
    if(opt.set)opt.set.add(b);
    damage(b,dmg,kd,a.face,opt);hitAny=true;
  }
  if(hitAny){hitstop=Math.max(hitstop,kd?.09:.05);sfx(kd?'heavy':'hit');}
  return hitAny;
}
function spark(x,y,col){for(let i=0;i<6;i++){const a=rand(0,Math.PI*2),v=rand(30,90);parts.push({x,y,z:0,vx:Math.cos(a)*v,vy:0,vz:Math.sin(a)*v,life:.22,max:.22,col:col||'#fff8c8',size:2,grav:0});}parts.push({x,y,z:0,vx:0,vy:0,vz:0,life:.08,max:.08,col:'#ffffff',size:7,grav:0});}
function damage(b,dmg,kd,dir,opt){
  if(b.kind==='prop'){b.dead=true;sfx('break');for(let i=0;i<10;i++)parts.push({x:b.x,y:b.y,z:8,vx:rand(-60,60),vy:0,vz:rand(40,120),life:.7,max:.7,col:i%2?'#6a6e78':'#3a3e46',size:3,grav:1});dropItem(b.drop,b.x,b.y);return;}
  if(b.kind==='player'&&isSpirit()){
    if(opt&&opt.super)dmg=Math.round(dmg*1.5);
    else{if(Math.random()<.25){floatMsg('ATRAVESSOU',b.x,b.y);for(let i=0;i<8;i++)parts.push({x:b.x+rand(-8,8),y:b.y,z:rand(10,44),vx:rand(-20,20),vy:0,vz:rand(-10,20),life:.4,max:.4,col:'#9fd8ff',size:2,grav:0});sfx('vanish');return;}
      dmg=Math.round(dmg*.5);kd=false;}
  }
  if(opt&&opt.tag&&b.type){const m=(WEAK[b.type]||{})[opt.tag];if(m)dmg=Math.round(dmg*m);}
  if(b.type==='azazel'){
    if(b.st==='held'||b.st==='dying')return;
    b.ctrl-=dmg;b.flash=.12;spark(b.x+dir*-4,b.y-b.z-30,'#ffd400');score+=dmg*10;
    if(b.ctrl<=0){b.ctrl=0;b.st='held';b.stT=0;b.stunT=6.5;b.vx=0;b.pin=null;projs=projs.filter(q=>q.owner!=='e');
      b.deanSide=(b.x-cam.x>110)?1:-1;
      if(isSpirit()){P.st='hold';P.stT=0;P.inv=99;P.y=b.y+2;P.face=-b.deanSide;P.x=clamp(b.x+b.deanSide*12,cam.x+10,cam.x+SW-10);b.autoColt=1.8;
        banner={l1:'JOHN SEGURA AZAZEL!',l2:'DEAN, ATIRA COM O COLT!',t:2.8};}
      else banner={l1:'O ESPÍRITO DO JOHN',l2:'SEGURA AZAZEL! ATIRE COM O COLT',t:2.8};
      flash=.6;sfx('magic');}
    return;
  }
  b.hp-=dmg;b.flash=.12;
  spark(b.x+dir*-4,b.y-b.z-30,b.kind==='player'?'#ff6a5a':'#c8f4ff');
  if(b.kind==='player'){sfx('hurt');shake=Math.max(shake,3);}
  else score+=dmg*10;
  if(b.isBoss){
    if(b.hp<=0){b.hp=0;bossDie(b);return;}
    if(['cwind','charge','swind','bwind','lwind','lunge','throw','pinw','drop','appear'].includes(b.st)){return;}
    if(kd){b.stag=(b.stag||0)+1;if(b.stag>=3){b.stag=0;knock(b,dir,1);return;}}
    b.st='hurt';b.stT=0;b.vx=dir*(kd?110:30);b.face=-dir;b.atkCd=Math.min(b.atkCd,.6);return;
  }
  if(b.hp<=0||kd){knock(b,dir,kd?1:.7);}
  else{b.st='hurt';b.stT=0;b.vx=dir*30;b.face=-dir;if(b.kind==='player'){P.run=false;}}
}
function knock(b,dir,f){b.st='air';b.stT=0;b.vx=dir*85*f;b.vz=130*f;b.z=Math.max(b.z,1);b.face=-dir;b.bounced=false;}
function physicsAir(e,dt){
  e.x+=e.vx*dt;e.z+=e.vz*dt;e.vz-=GRAV*dt;
  if(e.z<=0){e.z=0;if(!e.bounced&&e.vz<-110){e.vz=55;e.bounced=true;e.vx*=.5;sfx('land');shake=Math.max(shake,2);}else{e.vz=0;e.vx=0;return true;}}
  return false;
}

function updPlayer(dt,inp){
  const p=P,H=heroFor(hero);p.t+=dt;p.stT+=dt;if(p.inv>0)p.inv-=dt;if(p.flash>0)p.flash-=dt;if(p.shootCd>0)p.shootCd-=dt;if(p.comboT>0)p.comboT-=dt;else p.combo=0;
  const free=['idle','walk','run'].includes(p.st);
  if(free){
    const mvx=inp.x,mvy=inp.y;
    if(mvx)p.face=sgn(mvx);
    if(inp.run&&mvx)p.run=true;if(!mvx||sgn(mvx)!==p.face)p.run=false;
    const sp=p.run?H.spd*2:H.spd;
    p.x+=mvx*sp*dt;p.y+=mvy*H.spd*.66*dt;
    if(mvx||mvy){p.st=p.run?'run':'walk';p.ph+=dt*(p.run?14:9);}else p.st='idle';
    if(inp.jump){p.st='jump';p.stT=0;p.vz=170;p.vx=mvx*(p.run?H.spd*1.9:H.spd*1.1);p.jatk=false;p.z=.1;p.set=new Set();sfx('jump');}
    else if(inp.atk){
      if(p.run){p.st='runatk';p.stT=0;p.vx=p.face*160;p.set=new Set();sfx('swing');}
      else{const step=p.comboT>0&&p.lastHit?Math.min(2,p.combo):0;startAtk(step);}
    }
    else if(inp.shoot&&(coltReady()||p.shootCd<=0)){p.st='shoot';p.stT=0;p.shot=0;p.colt=coltReady();if(!p.colt)p.shootCd=H.shootCd;}
    else if(inp.magic&&p.magic>0){p.st='magic';p.stT=0;p.inv=1.4;p.mlvl=p.magic;p.magic=0;p.mDone=false;p.face0=p.face;p.spinT=0;sfx('magic');dimT=(hero==='sam'||hero==='cas')?1.3:.5;banner={l1:H.magicName,l2:'',t:1.3,small:true};}
  }

  else e.st='idle';

function playerProj(q){

function updTraps(dt){
  for(const t of traps)t.life-=dt;traps=traps.filter(t=>t.life>0);
  for(const e of ents){e.trapped=false;e.slowF=1;
    for(const t of traps)if(Math.hypot(e.x-t.x,(e.y-t.y)*3)<t.r){if(e.type==='dm'||e.type==='meg')e.trapped=true;else e.slowF=.45;}}
}

function engageTokens(){
  const list=ents.filter(e=>!e.dead&&['v','vp','dm'].includes(e.type)&&!['air','down','dead','getup'].includes(e.st));
  list.sort((a,b)=>Math.abs(a.x-P.x)-Math.abs(b.x-P.x));
  list.forEach((e,i)=>e.engaged=i<2);
}
function updEnemy(e,dt){
  e.t+=dt;e.stT+=dt;if(e.flash>0)e.flash-=dt;if(e.inv>0)e.inv-=dt;e.atkCd-=dt;e.vanCd-=dt;e.throwCd-=dt;

    case 'lunge':e.x=clamp(e.x+e.face*175*(e.slowF||1)*dt,cam.x+8,cam.x+SW-8);strike(e,[P],18,e.dmg,false,{set:e.set});if(e.stT>.32){e.st='recover';e.stT=0;}return;

      if(e.stT>.85){e.st='idle';e.fired=false;e.atkCd=rand(1,1.6);}return;
    case 'appear':e.alpha=Math.min(1,e.stT/.45);if(e.stT>.45){e.st='idle';e.alpha=1;}return;
    case 'vanish':e.alpha=Math.max(0,1-e.stT/.35);if(e.stT>.35){e.x=clamp(p.x-p.face*rand(50,70),cam.x+14,cam.x+SW-14);e.y=clamp(p.y+rand(-6,6),LT,LB);e.face=e.x<p.x?1:-1;e.st='appear';e.stT=0;sfx('vanish');}return;

    case 'down':if(e.stT>.7){if(e.hp<=0){e.st='dead';e.stT=0;sfx(e.ghost?'dissolve':'poof');score+=e.type==='g'?150:100;}else{e.st='getup';e.stT=0;e.inv=.4;}}return;
    case 'getup':if(e.stT>.35){e.st='idle';if(e.type==='v'&&Math.random()<.35){e.st='vanish';e.stT=0;}}return;
    case 'dead':e.alpha=1-e.stT/.6;if(Math.random()<.6)parts.push({x:e.x+rand(-10,10),y:e.y,z:rand(0,10),vx:0,vy:0,vz:e.type==='dm'?rand(60,110):rand(30,70),life:.6,max:.6,col:e.type==='vp'?(Math.random()<.5?'#8a1010':'#4a4a4a'):e.type==='dm'?'#0c080e':'#9fe8ff',size:e.type==='dm'?3:2,grav:0});
      if(e.stT>.6){e.dead=true;if(e.type==='g'?Math.random()<.6:Math.random()<.18)dropItem(Math.random()<.6?'salt':'burger',e.x,e.y);}return;
    case 'hurt':e.x+=e.vx*dt;e.vx*=Math.pow(.01,dt);if(e.stT>.26)e.st='idle';return;
    case 'windup':e.face=-side;if(e.stT>.4){e.st='eatk';e.stT=0;e.set=new Set();sfx('swing');}return;
    case 'eatk':if(e.stT<.12)strike(e,[P],24,e.dmg||8,false,{set:e.set});if(e.stT>.22){e.st='recover';e.stT=0;}return;
    case 'recover':if(e.stT>.4){e.st='idle';e.atkCd=rand(1,1.8);}return;

  else{tx=p.x+side*110;ty=p.y;}
  tx=clamp(tx,cam.x+12,cam.x+SW-12);
  const dx=tx-e.x,dy=ty-e.y;
  if(Math.abs(dx)>3||Math.abs(dy)>2){
    const sp=e.spd*(e.slowF||1);
    e.x+=Math.sign(dx)*Math.min(Math.abs(dx),sp*dt);
    e.y+=Math.sign(dy)*Math.min(Math.abs(dy),sp*.7*dt);
    e.st='walk';e.ph+=dt*8;}
  else e.st='idle';
  e.face=p.x>e.x?1:-1;
  e.y=clamp(e.y,LT,LB);
  if(e.type==='vp'&&e.hp<e.maxHp)e.hp=Math.min(e.maxHp,e.hp+2*dt);

  if(e.type==='vp'){if(e.engaged&&Math.abs(p.x-e.x)<72&&Math.abs(p.y-e.y)<7&&e.atkCd<=0){e.st='lwind';e.stT=0;}return;}
  if(e.type==='dm'){
    if(e.engaged&&Math.abs(p.x-e.x)<30&&Math.abs(p.y-e.y)<6&&e.atkCd<=0){e.st='windup';e.stT=0;}

    return;}
  if(e.type==='v'){
    if(e.engaged&&Math.abs(p.x-e.x)<30&&Math.abs(p.y-e.y)<6&&e.atkCd<=0){e.st='windup';e.stT=0;}
    else if(e.vanCd<=0&&Math.abs(p.x-e.x)>60){e.vanCd=rand(6,10);e.st='vanish';e.stT=0;sfx('vanish');}

}

function bossDie(b){b.st='dying';b.stT=0;b.vx=0;stopSong();sfx('die');flash=.8;shake=10;ents.forEach(e=>{if(e!==b&&!e.dead){e.st='dead';e.stT=0;}});projs=[];}

function updateZones(dt){
  const z=ZONES[zoneIdx];
  if(!zoneOn){
    if(z&&cam.x>=z.x-.5){zoneOn=true;cam.max=z.x;waveIdx=0;
      if(z.boss){spawnBoss();}else queueWave();}
    return;
  }
  if(spawnQ.length){spawnT-=dt;if(spawnT<=0){const t=spawnQ.shift();const left=spawnQ.length%2===0;spawnEnemy(t,left?cam.x+18:cam.x+SW-18,rand(LT+4,LB-4));spawnT=.5;}return;}
  if(z.boss)return;
  if(ents.every(e=>e.dead)){
    if(waveIdx<z.waves.length-1){waveIdx++;queueWave();}
    else{zoneOn=false;zoneIdx++;const n=ZONES[zoneIdx];cam.max=n?n.x:STAGE_W-SW;goT=3.5;}
  }
}
function queueWave(){spawnQ=ZONES[zoneIdx].waves[waveIdx].slice();spawnT=.6;}
function updateCam(dt){
  const target=clamp(P.x-130,0,cam.max);
  if(target>cam.x)cam.x+=Math.min(target-cam.x,140*dt);
  cam.x=clamp(cam.x,0,STAGE_W-SW);
  if(goT>0&&P.x>cam.x+SW*.6)goT=Math.min(goT,.5);
}

/* ============ Update ============ */
function update(dt){
  const inp=readInput(dt);
  if(mode==='continue'){contT-=dt;if(contT<=0){gameOverScreen();}return;}
  if(mode!=='play')return;
  if(hitstop>0){hitstop-=dt;return;}
  updPlayer(dt,inp);
  engageTokens();updTraps(dt);
  for(const e of ents){if(e.dead)continue;if(e.isBoss)updBoss(e,dt);else updEnemy(e,dt);}
  // projéteis
  for(const q of projs){
    q.x+=q.vx*dt;q.life-=dt;
    if(q.kind==='flask'){q.z+=q.vz*dt;q.vz-=GRAV*dt;if(q.z<=0){q.z=0;explodeFlask(q);q.dead=true;continue;}}
    if(q.life<=0||q.x<cam.x-20||q.x>cam.x+SW+20){q.dead=true;continue;}
    if(q.owner==='e'){
      const p=P;if(p.inv<=0&&!['down','air'].includes(p.st)&&Math.abs(p.y-q.y)<(q.big?9:7)&&Math.abs(p.x-q.x)<10&&p.z<14){q.dead=true;damage(p,q.dmg,q.big,sgn(q.vx),{super:true});}
    }else{
      playerProj(q);
    }
  }
  projs=projs.filter(q=>!q.dead);
  // itens
  for(const it of items){it.t+=dt;if(it.z>0||it.vz>0){it.z+=it.vz*dt;it.vz-=GRAV*dt;if(it.z<0){it.z=0;it.vz=0;}}
    if(Math.abs(it.x-P.x)<12&&Math.abs(it.y-P.y)<9&&P.z<10&&it.t>.3){it.dead=true;sfx('pick');
      if(it.type==='salt'){P.magic=Math.min(4,P.magic+1);floatMsg('+SAL',it.x,it.y);}
      else if(isSpirit()){floatMsg('ESPÍRITO NÃO COME',it.x,it.y);}
      else{const h=it.type==='pie'?40:20;P.hp=Math.min(P.maxHp,P.hp+h);floatMsg(it.type==='pie'?'TORTA!':'+VIDA',it.x,it.y);}
      score+=50;}}
  items=items.filter(i=>!i.dead&&i.t<25);
  ents=ents.filter(e=>!e.dead);props=props.filter(p=>!p.dead);
  // partículas
  for(const q of parts){q.life-=dt;if(q.ring){q.r+=q.vr*dt;continue;}q.x+=q.vx*dt;q.y+=q.vy*dt;q.z+=q.vz*dt;if(q.grav){q.vz-=GRAV*dt;if(q.z<0){q.z=0;q.vz=0;q.vx*=.5;}}}
  parts=parts.filter(q=>q.life>0);if(parts.length>500)parts.splice(0,parts.length-500);
  for(const r of saltRings)if(r.r>=r.max)r.life-=dt;saltRings=saltRings.filter(r=>r.life>0);
  if(saltRain>0){saltRain-=dt;for(let i=0;i<6;i++)parts.push({screen:true,x:rand(0,SW),y:rand(-10,30),vx:rand(-10,10),vy:rand(180,260),z:0,vz:0,life:1,max:1,col:Math.random()<.5?'#ffffff':'#d8d8e0',size:2,grav:0});}
  for(const q of parts)if(q.screen){q.y+=q.vy*dt;}
  updateZones(dt);updateCam(dt);
  if(banner){banner.t-=dt;if(banner.t<=0)banner=null;}
  if(goT>0)goT-=dt;

/* ============ Abertura: a estrada até aqui ============ */
const L_MARY={skin:'#f0c8a0',hair:'#e8c878',style:'woman',jacket:'#f2f0ec',jacketD:'#c8c4bc',shirt:'#ffffff',dress:'#f4f2ee',dressD:'#cfcac2',skirt:true,eye:'#1a1010',boots:'#000',tall:1};
const L_JOHN={skin:'#e4b088',hair:'#3a2a1c',style:'short',jacket:'#5a4630',jacketD:'#3a2c1c',shirt:'#8a8478',pants:'#3a4258',pantsD:'#283044',boots:'#1a1410',tall:2};
const L_KID={skin:'#f0c098',hair:'#d8b060',style:'short',jacket:'#4a6a9a',jacketD:'#34507a',shirt:'#6a8aba',pants:'#4a6a9a',pantsD:'#34507a',boots:'#d8d0c0',tall:-8};
const L_SHADOW={skin:'#0c0c10',hair:'#050508',style:'short',jacket:'#0c0c12',jacketD:'#060608',shirt:'#101018',pants:'#0a0a10',pantsD:'#060608',boots:'#000',eye:'#ffd400',tall:2};
let introI=0,introT=0,introWait=0,cut=[];
function startIntro(){mode='intro';introI=-1;nextScene();}
function nextScene(){
  introI++;if(introI>=INTRO.length){endIntro();return;}
  introT=0;introWait=0;cut=[];
  const sc=INTRO[introI],cap=$('#cap');
  if(sc.sfx)sc.sfx();
  if(sc.text){cap.hidden=false;$('#capPlace').textContent=sc.place;$('#capHint').textContent=touchMode?'TOQUE PARA SEGUIR':'ENTER PARA SEGUIR';typeText($('#capText'),sc.text);}
  else{cap.hidden=true;if(typing){clearInterval(typing);typing=null;}}
  layout();
}
function advanceIntro(){if(introT<.3)return;const el=$('#capText');if(typing&&el){clearInterval(typing);typing=null;el.textContent=el.dataset.full;return;}nextScene();}
function endIntro(){if(typing){clearInterval(typing);typing=null;}$('#cap').hidden=true;chapter=1;selectScreen();}
function updIntro(dt){
  const sc=INTRO[introI];if(!sc)return;
  if(sc.auto){if(introT>sc.auto)nextScene();}
  else if(!typing){introWait+=dt;if(introWait>4.5)nextScene();}
  for(const q of cut){q.x+=q.vx*dt;q.y+=q.vy*dt;q.life-=dt;}
  cut=cut.filter(q=>q.life>0);if(cut.length>700)cut.splice(0,cut.length-700);
}
function renderIntro(){
  c.setTransform(1,0,0,1,0,0);c.globalAlpha=1;
  const sc=INTRO[introI];if(sc)sc.draw(introT);
  if(introT<.45){c.globalAlpha=1-introT/.45;c.fillStyle='#000';c.fillRect(0,0,SW,SH);c.globalAlpha=1;}
  c.fillStyle='#000';c.fillRect(0,0,SW,8);c.fillRect(0,SH-8,SW,8);
}
function drawCut(){for(const q of cut){c.globalAlpha=Math.max(0,Math.min(1,q.life/q.max));c.fillStyle=q.col;c.fillRect(Math.round(q.x),Math.round(q.y),q.s,q.s);}c.globalAlpha=1;}
const FIRE=['#ffd23a','#ff8a1a','#e8401a','#ffef9a'];
function flames(x,y,w,n){for(let i=0;i<n;i++)cut.push({x:x+rand(0,w),y:y+rand(-2,2),vx:rand(-6,6),vy:rand(-42,-14),life:rand(.4,.9),max:.9,col:FIRE[(Math.random()*4)|0],s:Math.random()<.3?2:1});}
function smoke(x,y,n){for(let i=0;i<n;i++)cut.push({x:x+rand(-8,8),y,vx:rand(-3,9),vy:rand(-22,-10),life:rand(1.4,2.2),max:2.2,col:'rgba(28,24,32,.75)',s:3});}
function pine(x,base,h,col){for(let y=0;y<h;y++){const w=Math.round((y/h)*h*.32)+1;c.fillStyle=col;c.fillRect(x-w,base-h+y,w*2+1,1);}c.fillRect(x-1,base,3,4);}
function lawn(y,col){px(c,0,y,SW,SH-y,col);const R=seeded(9);for(let i=0;i<260;i++){c.fillStyle=R()<.5?'#1a2a1e':'#0c140e';c.fillRect((R()*SW)|0,(y+R()*(SH-y))|0,1+(R()*2|0),1);}}
function drawHouse(x,y,stage,t){
  for(let r=0;r<28;r++){const w=Math.round(136-r*4.8);px(c,x+68-w/2,y-74-r,w,1,r%4?'#1c1a26':'#16141e');}
  px(c,x,y-74,136,74,'#2c2c3c');for(let yy=y-70;yy<y;yy+=4)px(c,x,yy,136,1,'#25252f');
  px(c,x+104,y-110,10,22,'#24202a');
  const fl=Math.random()<.5;
  const win=(wx,wy,col)=>{px(c,wx-1,wy-1,20,16,'#14121a');px(c,wx,wy,18,14,col);px(c,wx+8,wy,2,14,'#14121a');px(c,wx,wy+6,18,2,'#14121a');};
  let nur='#c8a050';
  if(stage==='flicker')nur=Math.random()<.3?'#16141e':'#c8a050';
  if(stage==='burn')nur=fl?'#ff9a2a':'#ffd060';
  const hot=stage==='burn';
  win(x+18,y-62,nur);win(x+100,y-62,hot?(fl?'#ff7a1a':'#ffc040'):'#1a2030');
  win(x+18,y-32,hot?(!fl?'#ff7a1a':'#ffc040'):'#3a3420');win(x+100,y-32,hot?'#ff8a2a':'#1a2030');
  px(c,x+58,y-34,18,34,hot?'#5a2a10':'#3a2a20');px(c,x+72,y-18,2,2,'#c8a050');
  px(c,x-6,y-37,148,3,'#3a3a48');for(let k=0;k<10;k++)px(c,x-4+k*15,y-34,2,34,'#30303c');
  if(hot){flames(x+18,y-64,18,3);flames(x+100,y-64,18,3);flames(x+18,y-34,18,2);flames(x+100,y-34,18,2);flames(x+8,y-100,120,5);if(Math.random()<.5)smoke(x+68,y-104,1);}
}
function sceneCard(t){

function sceneNursery(t){
  px(c,0,0,SW,170,'#161828');for(let x=0;x<SW;x+=14)px(c,x,0,1,170,'#1b1e30');px(c,0,0,SW,14,'#0e0f1a');

  const bx=200,by=178;

  px(c,bx+2,by-14,58,6,'#d8d0e0');px(c,bx+24,by-19,12,6,'#ece4f4');px(c,bx+33,by-19,4,4,'#f0c098');
  for(let k=0;k<11;k++)px(c,bx+2+k*6,by-38,2,32,'#8a6440');
  px(c,bx+30,14,1,28,'#555');const ma=t*1.4;
  for(let k=0;k<3;k++){const ax=bx+31+Math.cos(ma+k*2.1)*12;px(c,ax-2,42,4,4,['#e8c040','#7ab0e0','#e07a8a'][k]);}
  const evil=t<3.4;

  px(c,112,140,8,30,'#3a2a20');px(c,104,128,24,12,lampOn?'#e8c878':'#2a2418');

  if(evil){

    const w=Math.min(SW,k*190);flames(160-w/2,22,w,Math.min(10,2+k*5));
    drawCut();
    c.fillStyle=`rgba(255,110,30,${Math.min(.32,k*.18)})`;c.fillRect(0,0,SW,SH);
    return;

function sceneDrive(t){

  px(c,140,114,40,36,'#1e1a14');for(let r=0;r<20;r++){const w=Math.round(Math.sqrt(400-r*r))*2;px(c,160-w/2,114-r+1,w,1,'#1e1a14');}
  const palm=(x)=>{for(let i=0;i<60;i++)px(c,x+Math.round(Math.sin(i/22)*4),150-i,3,1,'#2a2018');

const INTRO=[
  {draw:sceneCard,auto:2.8,sfx:()=>{noise(.5,.3,700);}},
  {place:'LAWRENCE, KANSAS · 2 DE NOVEMBRO DE 1983',text:'Era para ser uma noite comum na casa dos Winchester. Mary pôs o pequeno Sam, de seis meses, no berço e foi dormir. Lá em cima, as luzes começaram a piscar.',draw:sceneHouse},
  {place:'O QUARTO DO SAM',text:'Mary achou que fosse John debruçado sobre o berço. Não era. Era uma coisa de olhos amarelos. Minutos depois, ela estava presa no teto, em chamas.',draw:sceneNursery},
  {place:'NAQUELA MESMA NOITE',text:'John tirou Dean e o bebê de casa e viu tudo queimar. Ali começou a caçada da vida dele: encontrar o que matou Mary.',draw:sceneFire},
  {place:'A ESTRADA',text:'Os meninos cresceram entre motéis, sal grosso e espingardas. Dean virou caçador como o pai. Sam quis outra vida e foi estudar em Stanford.',draw:sceneDrive},
  {place:'STANFORD, CALIFÓRNIA · 2005',text:'Até que, numa madrugada, Dean bate na porta do irmão: "O pai saiu pra caçar e não volta faz dias." Sam entra no Impala. Só por um fim de semana.',draw:sceneStanford},
  {place:'JERICHO, CALIFÓRNIA',text:'A última pista do diário de John leva a uma estrada escura, onde homens somem depois de dar carona a uma moça de vestido branco.',draw:sceneJericho},
];

function selectScreen(){
  mode='select';layers=getLayers(chapter);$('#cap').hidden=true;
  const C=CHAPTERS[chapter];if(!C.heroes.includes(hero))hero=C.heroes[0];
  show(`<div class="box"><p class="eyebrow">CAPITULO ${chapter} · ESCOLHA SEU CAÇADOR</p><div class="pick">${heroCards(C)}</div><p class="fine">${C.hint}</p></div>`);
  paintPortraits();
}
function pause(){if(mode!=='play')return;mode='pause';show(`<div class="box"><p class="eyebrow">PAUSA</p><h2>Respira, caçador.</h2><div class="row"><button class="btn go" data-act="resume">▶ CONTINUAR</button><button class="btn" data-act="restart">REINICIAR</button><button class="btn" data-act="title">MENU</button></div></div>`);showPad();}
function resume(){hideScreen();mode='play';showPad();}
function gameOverScreen(){mode='over';showPad();show(`<div class="box"><p class="eyebrow">FIM DE JOGO</p><h2>A estrada venceu desta vez.</h2><p class="sub">${CHAPTERS[chapter].over}</p><div class="row"><button class="btn go" data-act="restart">▶ TENTAR DE NOVO</button><button class="btn" data-act="pickagain">TROCAR CAÇADOR</button></div></div>`);}
function endingScreen(){
  mode='ending';showPad();const C=CHAPTERS[chapter],last=chapter===4;saveProgress(chapter+1);
  const btns=last?`<button class="btn go" data-act="chap" data-n="1" type="button">▶ JOGAR DE NOVO</button><button class="btn" data-act="title" type="button">MENU</button>`
    :`<button class="btn go" data-act="next" type="button">▶ CAPITULO ${chapter+1}</button><button class="btn" data-act="restart" type="button">JOGAR DE NOVO</button>`;
  show(`<div class="box"><p class="eyebrow">${last?'WINCHESTER · FIM DA PARTE 1':'FIM DO CAPITULO '+chapter}</p><h2>${C.outro.h}</h2>
    <p class="txt" id="tw"></p>
    <p class="sub">Pontos: ${String(score).padStart(6,'0')}</p>
    ${last?'<p class="fine">Fim da Parte 1. A Parte 2, O Apocalipse (temporadas 3 a 5), está em produção.</p>':''}
    <div class="row">${btns}</div></div>`);
  typeText($('#tw'),C.outro.t);
}
scr.addEventListener('click',e=>{
  if(e.target.id==='tw'&&typing){clearInterval(typing);typing=null;e.target.textContent=e.target.dataset.full;return;}
  const b=e.target.closest('[data-act]');if(!b)return;audioOn();
  const a=b.dataset.act;
  if(a==='pick'){hero=b.dataset.id;startGame();}
  else if(a==='resume')resume();
  else if(a==='restart')startGame();
  else if(a==='pickagain')selectScreen();
  else if(a==='title')titleScreen();
  else if(a==='next')chapterIntro(chapter+1);
  else if(a==='chap')chapterIntro(+b.dataset.n);
});

/* ============ Layout ============ */
function layout(){
  const app=$('#app'),vw=app.clientWidth,vh=app.clientHeight;
  const padOn=!$('#pad').hidden,portrait=vh>vw;
  let availH=vh,top=0;
  const intro=mode==='intro';
  if(padOn&&portrait){availH=vh-210;}
  if(intro)availH=vh-(portrait?200:150);
  let s=Math.min(vw/SW,availH/SH);
  if(!touchMode&&s>=2)s=Math.floor(s);
  const w=Math.round(SW*s),h=Math.round(SH*s);
  top=intro?Math.max(8,Math.round((availH-h)/2)):padOn&&portrait?Math.min(Math.max(48,Math.round((availH-h)*.3)),Math.max(48,availH-h)):Math.round((vh-h)/2);
  cv.style.width=w+'px';cv.style.height=h+'px';cv.style.left=Math.round((vw-w)/2)+'px';cv.style.top=top+'px';
  const cap=$('#cap');
  if(!cap.hidden){cap.style.left=Math.round((vw-w)/2)+'px';cap.style.width=w+'px';
    cap.style.top=(top+h)+'px';cap.style.bottom='';}
}
addEventListener('resize',layout);

/* ============ Loop ============ */
let last=performance.now(),titleCam=0,navPrev=0;
function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  if(mode==='play'||mode==='continue')update(dt);
  else if(mode==='title'||mode==='intro'){const inp=readInput(dt),kb=((keys.ArrowDown||keys.KeyS)?1:0)-((keys.ArrowUp||keys.KeyW)?1:0),py=inp.y-kb,ny=py>.5?1:py<-.5?-1:0;
    if(mode==='title'){if(ny&&ny!==navPrev)titleNav(ny);if(inp.atk||inp.jump||inp.shoot||inp.magic)titleConfirm();}
    else{introT+=dt;updIntro(dt);if(inp.atk||inp.jump)advanceIntro();}
    navPrev=ny;}
  else if(['story','select','controls'].includes(mode)){titleCam+=dt*18;cam.x=(Math.sin(titleCam/500)*.5+.5)*(STAGE_W-SW);}
  render();
  requestAnimationFrame(frame);
}
layers=getLayers(1);layout();titleScreen();
(document.fonts&&document.fonts.load?document.fonts.load('8px "Press Start 2P"'):Promise.resolve()).catch(()=>{}).finally(()=>requestAnimationFrame(frame));
</script>
