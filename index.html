<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Winchester: fan game em pixel art no estilo beat 'em up, inspirado em Supernatural. Feito por Gabriel Silvano.">
<title>Winchester: O Negócio da Família</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap">
<style>
/* Layout: tela de console 320x224 ampliada sem suavizar; no celular em pé, controles ficam embaixo como num portátil */
:root{
  --void:#07060d;
  --panel:#0f0d1a;
  --rim:#3a3150;
  --bone:#efe8d6;
  --mist:#9fb6c8;
  --amber:#f2b632;
  --blood:#c8392c;
  --ghost:#9fe8ff;
  --f-pixel:'Press Start 2P','Courier New',monospace;
  --f-text:'VT323','Courier New',monospace;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;background:var(--void);color:var(--bone);overflow:hidden}
body{font-family:var(--f-text);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
#app{position:fixed;inset:0;background:var(--void);overflow:hidden}
#cv{position:absolute;image-rendering:pixelated;image-rendering:crisp-edges;background:#000;touch-action:none}
button{font-family:var(--f-pixel);cursor:pointer;color:var(--bone)}
button:focus-visible{outline:2px solid var(--amber);outline-offset:2px}

#topbtns{position:absolute;right:calc(env(safe-area-inset-right,0px) + 8px);top:calc(env(safe-area-inset-top,0px) + 8px);display:flex;gap:6px;z-index:5}
#topbtns button{background:rgba(15,13,26,.85);border:2px solid var(--rim);font-size:9px;padding:7px 8px;line-height:1}

/* Telas */
#screen{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;overflow-y:auto;z-index:4;background:rgba(7,6,13,.72)}
.box{width:100%;max-width:620px;margin:auto;background:var(--panel);border:3px solid var(--rim);box-shadow:0 0 0 3px var(--void),0 0 0 6px var(--amber);padding:22px 20px;display:flex;flex-direction:column;gap:14px}
.box.clear{background:transparent;border:0;box-shadow:none;padding:0}
.eyebrow{font-family:var(--f-pixel);font-size:10px;color:var(--amber);letter-spacing:.08em;margin:0;line-height:1.6}
h1{font-family:var(--f-pixel);font-weight:400;font-size:clamp(22px,6.4vw,40px);line-height:1.25;margin:0;color:var(--bone);text-shadow:4px 4px 0 var(--blood)}
h1 span{color:var(--amber);text-shadow:4px 4px 0 #6a3a00}
h2{font-family:var(--f-pixel);font-weight:400;font-size:clamp(14px,3.6vw,20px);line-height:1.4;margin:0;color:var(--bone)}
.txt{font-size:24px;line-height:1.15;margin:0;color:var(--bone);min-height:3em}
.sub{font-size:20px;line-height:1.15;color:var(--mist);margin:0}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{background:var(--panel);border:3px solid var(--rim);padding:12px 14px;font-size:11px;line-height:1.3}
.btn:hover{border-color:var(--mist)}
.btn.go{background:var(--amber);color:#1a1206;border-color:#ffd77a}
.blink{animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.keys{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:20px;line-height:1.1;border-top:2px dashed var(--rim);padding-top:12px}
.keys dt{font-family:var(--f-pixel);font-size:9px;color:var(--amber);padding-top:5px}
.keys dd{margin:0;color:var(--mist)}
.fine{font-size:17px;color:#6c6884;margin:0;line-height:1.1}

.pick{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.card{background:#0a0914;border:3px solid var(--rim);padding:12px;display:flex;flex-direction:column;gap:8px;text-align:left;color:var(--bone);font-family:var(--f-text)}
.card:hover,.card:focus-visible{border-color:var(--amber);outline:none}
.card canvas{width:144px;height:144px;image-rendering:pixelated;align-self:center;background:radial-gradient(circle at 50% 70%,#221c3a,#0a0914 70%)}
.card .nm{font-family:var(--f-pixel);font-size:14px;color:var(--amber)}
.card .ln{font-size:19px;line-height:1.05;color:var(--mist)}
.card .ln b{color:var(--bone);font-weight:400}
.stat{display:grid;grid-template-columns:7.5em 1fr;align-items:center;font-size:18px;color:var(--mist)}
.stat i{display:flex;gap:3px}
.stat i::before{content:'';display:block;height:9px;width:calc(var(--v) * 15px);background:repeating-linear-gradient(90deg,var(--blood) 0 12px,transparent 12px 15px)}
.newhero{display:flex;gap:12px;align-items:center;border:3px solid var(--amber);background:#141022;padding:10px}
.newhero canvas{width:96px;height:96px;flex:none;image-rendering:pixelated;background:radial-gradient(circle at 50% 70%,#2a2244,#0a0914 70%)}
.newhero .nh{display:flex;flex-direction:column;gap:4px;min-width:0}
.newhero .tag,.card .tag{font-family:var(--f-pixel);font-size:9px;color:#1a1206;background:var(--amber);padding:3px 6px;align-self:flex-start}
.newhero p{margin:0;font-size:20px;line-height:1.1;color:var(--bone)}
.newhero .nm{font-family:var(--f-pixel);font-size:13px;color:var(--amber)}
.card.isnew{border-color:var(--amber)}
@media (max-width:520px){.pick{grid-template-columns:1fr}.card{flex-direction:row;flex-wrap:wrap;align-items:center}.card canvas{width:96px;height:96px}.card .info{flex:1;min-width:0}}

/* Legenda da abertura */
#cap{position:absolute;z-index:4;box-sizing:border-box;padding:12px 14px;background:var(--void);display:flex;flex-direction:column;gap:6px}
#cap.below{background:var(--void)}
#capPlace{overflow-wrap:anywhere;font-family:var(--f-pixel);font-size:clamp(7px,2vw,9px);color:var(--amber);margin:0;letter-spacing:.06em;line-height:1.6}
#capText{font-size:clamp(20px,2.5vw,26px);line-height:1.1;margin:0;color:var(--bone);min-height:3.3em}
.caprow{display:flex;justify-content:space-between;align-items:center;gap:10px}
#capHint{font-family:var(--f-pixel);font-size:8px;color:var(--mist)}
#capSkip{background:transparent;border:2px solid var(--rim);font-size:8px;padding:7px 9px}
/* Controles de toque */
#pad{position:absolute;left:0;right:0;bottom:0;z-index:3;pointer-events:none}
#stick{position:absolute;left:calc(env(safe-area-inset-left,0px) + 22px);bottom:calc(env(safe-area-inset-bottom,0px) + 26px);width:132px;height:132px;border-radius:50%;background:rgba(15,13,26,.7);border:3px solid var(--rim);pointer-events:auto;touch-action:none}
#knob{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;background:#2a2340;border:3px solid var(--mist)}
#btns{position:absolute;right:calc(env(safe-area-inset-right,0px) + 16px);bottom:calc(env(safe-area-inset-bottom,0px) + 16px);width:176px;height:156px;pointer-events:auto}
#btns button{position:absolute;width:64px;height:64px;border-radius:50%;border:3px solid var(--rim);background:rgba(15,13,26,.8);font-size:8px;line-height:1.3;touch-action:none;padding:0}
#bAtk{right:0;top:46px;border-color:var(--blood)!important;width:72px!important;height:72px!important;background:rgba(80,20,16,.8)!important}
#bJmp{left:56px;top:0;border-color:var(--amber)!important}
#bSht{left:0;top:52px}
#bMag{left:56px;bottom:0;border-color:var(--ghost)!important}
#btns button.on{filter:brightness(1.6)}
</style>
</head>
<body>
<div id="app">
  <canvas id="cv" width="320" height="224"></canvas>
  <div id="topbtns"><button id="sndBtn" type="button">SOM ON</button><button id="pauseBtn" type="button">II</button><button id="skipTut" type="button" hidden>PULAR TREINO</button></div>
  <div id="pad" hidden>
    <div id="stick"><div id="knob"></div></div>
    <div id="btns">
      <button id="bJmp" type="button">PULO</button>
      <button id="bSht" type="button">TIRO</button>
      <button id="bAtk" type="button">ATACAR</button>
      <button id="bMag" type="button">MAGIA</button>
    </div>
  </div>
  <div id="cap" hidden><p id="capPlace"></p><p id="capText"></p><div class="caprow"><span id="capHint" class="blink"></span><button id="capSkip" type="button">PULAR ▶▶</button></div></div>
  <div id="screen"></div>
</div>

<script src="js/base.js"></script>
<script src="js/cenario.js"></script>
<script src="js/cenarios2.js"></script>
<script src="js/audio.js"></script>
<script src="js/capitulos.js"></script>
<script src="js/entrada.js"></script>
<script src="js/combate.js"></script>
<script src="js/conteudo.js"></script>
<script src="js/quadro.js"></script>
<script src="js/telas.js"></script>
<script src="js/main.js"></script>
</body>
</html>
